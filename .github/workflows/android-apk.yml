name: Construire APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Installer les composants Android et natifs
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Construire l'APK
        run: gradle :app:assembleDebug

      - name: Publier l'APK de test
        uses: actions/upload-artifact@v4
        with:
          name: GBA4KUltimate-APK
          path: app/build/outputs/apk/debug/*.apk
